version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/RhythmDoctor.Archipelago"
    schedule:
      interval: "weekly"
    assignees:
      - "nonperforming"
    ignore:
      # Pinned to game (Unity) version
      - dependency-name: "UnityEngine.Modules"
      - dependency-name: "System.Text.Encodings.Web"
      - dependency-name: "Microsoft.NETFramework.ReferenceAssemblies"
      # Formatting style can change with updates
      - dependency-name: "csharpier"
    registries:
      - nuget
      - bepinex
      - samboy
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "nonperforming"

registries:
  nuget:
    type: "nuget-feed"
    url: "https://api.nuget.org/v3/index.json"
  bepinex:
    type: "nuget-feed"
    url: "https://nuget.bepinex.dev/v3/index.json"
  samboy:
    type: "nuget-feed"
    url: "https://nuget.samboy.dev/v3/index.json"
