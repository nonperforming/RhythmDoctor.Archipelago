version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/RhythmDoctor.Archipelago"
    schedule:
      interval: "weekly"
    assignees:
      - "nonperforming"
    ignore:
      - dependency-name: "UnityEngine.Modules"
      - dependency-name: "Microsoft.NETFramework.ReferenceAssemblies"
      - dependency-name: "csharpier"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "nonperforming"
