name: Check Formatting
on:
  push:
    paths-ignore:
      - "**"
      - "!**.cs"

jobs:
  check-formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.1.0

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier --check .