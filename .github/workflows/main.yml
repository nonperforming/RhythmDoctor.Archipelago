name: Build
on:
  push:
    paths-ignore:
      - "**"
      - "!.github/workflows/main.yml"
      - "!RhythmDoctor.Archipelago.sln"
      - "!RhythmDoctor.Archipelago/**"
      - "RhythmDoctor.Archipelago/.idea"
      - "RhythmDoctor.Archipelago/.editorconfig"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          submodules: recursive

      - name: Cache
        uses: actions/cache@v5.0.1
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget

      - name: Build client
        run: dotnet publish RhythmDoctor.Archipelago --configuration Debug --output build --verbosity normal

      - name: Upload client plugin
        uses: actions/upload-artifact@v6.0.0
        with:
          name: "RhythmDoctor.Archipelago.dll"
          path: |
            build/Assets
            build/Archipelago.MultiClient.Net.dll
            build/io.github.nonperforming.pulse.dll
            build/io.github.nonperforming.pulse.pdb
            build/RhythmDoctor.Archipelago.dll
            build/RhythmDoctor.Archipelago.pdb
            build/YamlDotNet.dll
          if-no-files-found: error
