name: Build
on:
  pull_request:
    paths-ignore:
      - "**LICENSE"
      - "**.editorconfig"
      - "**.git**"
      - "!.github/workflows/**"
  push:
    paths-ignore:
      - "**LICENSE"
      - "**.editorconfig"
      - "**.git**"
      - "!.github/workflows/**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Cache
        uses: actions/cache@v4.1.2
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.1.0

      - name: Build client
        run: dotnet publish --configuration Debug --output build --verbosity diagnostic

      - name: Copy APWorld data
        run: |
          mkdir -p "RhythmDoctor.Archipelago/build/World/data/"
          cp -r World/data/* "RhythmDoctor.Archipelago/build/World/data/"
          ls
          ls RhythmDoctor.Archipelago/build/World/data
          tree

      - name: Upload client plugin
        uses: actions/upload-artifact@v4.4.3
        with:
          name: "RhythmDoctor.Archipelago.dll"
          path: |
            "RhythmDoctor.Archipelago/build/World/data/*"
            "RhythmDoctor.Archipelago/build/Archipelago.MultiClient.Net.dll"
            "RhythmDoctor.Archipelago/build/RhythmDoctor.Archipelago.dll"
            "RhythmDoctor.Archipelago/build/RhythmDoctor.Archipelago.pdb"
            "RhythmDoctor.Archipelago/build/YamlDotNet.dll"
          if-no-files-found: error

      - name: Upload APWorld
        uses: actions/upload-artifact@v4.4.3
        with:
          name: "RhythmDoctor.apworld"
          path: "World/"
          if-no-files-found: error
