name: Build
on:
  push:
    paths-ignore:
      - "**LICENSE"
      - "**.editorconfig"
      - "**.git**"
      - "!.github/workflows/**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Cache
        uses: actions/cache@v4.2.1
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget
         
      - name: Build client
        run: dotnet publish RhythmDoctor.Archipelago --configuration Debug --output build --verbosity normal

      - name: Copy APWorld data
        run: |
          mkdir -p "build/World/data/"
          cp -r World/data/* "build/World/data/"

      - name: Upload client plugin
        uses: actions/upload-artifact@v4.6.0
        with:
          name: "RhythmDoctor.Archipelago.dll"
          path: |
            build/World/data/*
            build/Archipelago.MultiClient.Net.dll
            build/RhythmDoctor.Archipelago.dll
            build/RhythmDoctor.Archipelago.pdb
            build/YamlDotNet.dll
          if-no-files-found: error

      - name: Upload APWorld
        uses: actions/upload-artifact@v4.6.0
        with:
          name: "RhythmDoctor.apworld"
          path: "World/"
          if-no-files-found: error
