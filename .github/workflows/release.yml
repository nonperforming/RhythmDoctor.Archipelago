name: Release Build
on: workflow_dispatch

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget

      - name: Build client
        run: dotnet publish RhythmDoctor.Archipelago --configuration Release --output build --verbosity normal

      # https://github.com/ebkr/r2modmanPlus/wiki/Structuring-your-Thunderstore-package#bepinex
      # TODO: Consider using tag name or pull version from .csproj
      - name: Organize plugin files
        run: |
          cd build
          mkdir --parents plugins/RhythmDoctor.Archipelago
          mv Assets Archipelago.MultiClient.Net.dll io.github.nonperforming.pulse.dll RhythmDoctor.Archipelago.dll plugins/RhythmDoctor.Archipelago
          zip --recurse-paths ../RhythmDoctor.Archipelago.zip plugins

      - name: Upload client plugin
        uses: actions/upload-artifact@v7.0.0
        with:
          path: RhythmDoctor.Archipelago.zip
          if-no-files-found: error
          archive: false # otherwise GitHub will zip the zip

        # When we get on Thunderstore, upload the artifact zip here.
