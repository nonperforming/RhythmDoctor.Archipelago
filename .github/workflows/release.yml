name: Release Build
on: workflow_dispatch

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Cache
        uses: actions/cache@v5.0.3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget

      - name: Build client
        run: dotnet publish RhythmDoctor.Archipelago --configuration Release --output build --verbosity normal

      # https://github.com/ebkr/r2modmanPlus/wiki/Structuring-your-Thunderstore-package#bepinex
      - name: Organize plugin files
        run: |
          cd build
          mkdir --parents plugins/RhythmDoctor.Archipelago
          mv Assets Archipelago.MultiClient.Net.dll io.github.nonperforming.pulse.dll RhythmDoctor.Archipelago.dll plugins/RhythmDoctor.Archipelago
          touch .rdap
      # 01/01/2026: Double zipping due to https://github.com/actions/upload-artifact/issues/426
      #    zip --recurse-paths release.zip plugins

      - name: Upload client plugin
        uses: actions/upload-artifact@v6.0.0
        with:
          name: "RhythmDoctor.Archipelago"
          path: |
            build/plugins/*
            build/.rdap
          if-no-files-found: error

        # When we get on Thunderstore, upload the artifact zip here.
