[project]
name = "rdap-developer-menu"
version = "0.0.1"
requires-python = ">=3.15"
dependencies = [
    "psutil>=7.2.2",
    "textual>=8.2.6",
]

[dependency-groups]
dev = ["textual-dev>=1.8.0"]

[tool.ruff]
target-version = "py315"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["FBT", "TD"]
